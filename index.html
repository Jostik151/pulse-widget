                            </svg>
                        </div>
                    </div>

                        </svg>
                    </div>

                    <!-- Option C: Standard Level Badge (Image 5: showRank=false, showIcon=false) -->
                    <div class="psw-level-badge hidden" id="pswLevelBadge">10</div>

                    <span class="psw-elo" id="pswElo">...</span>
                </div>

                <div class="psw-kdr" id="pswKdr">... KDR</div>

                <div class="psw-right">
                    <span class="psw-flag" id="pswFlag"></span>
                    <span class="psw-country-rank" id="pswCountryRank"></span>
                </div>
            </div>

            <!-- Mid Section: Interactive Slides (Last 30 Matches ⇄ Stats Today) -->
            <div class="psw-mid-section" id="pswMidSection">
                <!-- Slide 1: Matches -->
                <div class="psw-slide psw-slide-matches active" id="pswSlideMatches">
                    <div class="psw-mid-row" id="pswMatchesHeader">ЗАВАНТАЖЕННЯ ДАНИХ...</div>
                    <div class="psw-bot-row">
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswWinrate">...</div>
                            <div class="psw-stat-lbl">Win rate</div>
                        </div>
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswKillsAdr">... / ...</div>
                            <div class="psw-stat-lbl">Avg. Kills / ADR</div>
                        </div>
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswKdKr">... / ...</div>
                            <div class="psw-stat-lbl">K/D / K/R</div>
                        </div>
                    </div>
                </div>

                <!-- Slide 2: Stats Today -->
                <div class="psw-slide psw-slide-today" id="pswSlideToday">
                    <div class="psw-mid-row">STATS TODAY</div>
                    <div class="psw-bot-row">
                        <div class="psw-stat-col">
                            <div class="psw-stat-val psw-wl-val">
                                <span class="psw-win-num" id="pswTodayWins">0</span>
                                <span class="psw-loss-num" id="pswTodayLosses">0</span>
                            </div>
                            <div class="psw-stat-lbl psw-wl-lbl">
                                <span class="psw-win-text">Wins</span>
                                <span class="psw-loss-text">Losses</span>
                            </div>
                        </div>
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswTodayKillsAdr">0/0</div>
                            <div class="psw-stat-lbl">Avg. Kills / ADR</div>
                        </div>
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswTodayKd">0</div>
                            <div class="psw-stat-lbl">K/D</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==============================================
             LAYOUT 2: PRO WIDE BANNER (media_1790812631607.png)
             ============================================== -->
        <div class="pulse-pro-banner" id="pulseProBanner" style="display: none;">

                <div class="ppb-player-info">
                    <div class="ppb-emblem">

                    </div>
                    <div class="ppb-name-elo">

                        <div class="ppb-elo-row">

                        <div class="ppb-stat-val" id="ppbKd">...</div>
                        <div class="ppb-stat-lbl">KD</div>
                    </div>
                    <div class="ppb-stat-item">
                        <div class="ppb-stat-val" id="ppbKr">...</div>
                        <div class="ppb-stat-lbl">KR</div>
                    </div>
                </div>

            <!-- Glowing divider line -->
            <div class="ppb-divider"></div>

            <!-- Bottom row: Ranks & W/L streak -->
            <div class="ppb-bot-row" id="ppbBotRow">

                    </span>
                    <span class="ppb-rank-item" id="ppbCountryRankWrap">
                        <span class="ppb-rank-flag" id="ppbCountryFlag"></span>
                        <span id="ppbCountryRank">#...</span>
                    </span>
                </div>

                <!-- Last matches streak (e.g. W L L L W) or Today swap -->
                <div class="ppb-streak" id="ppbStreak">
                    <span class="ppb-w">W</span>
                    <span class="ppb-w">W</span>
                    <span class="ppb-l">L</span>
                    <span class="ppb-l">L</span>
                    <span class="ppb-w">W</span>
                </div>
            </div>
        </div>
    </div>
