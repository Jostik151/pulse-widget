<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceit Pulse Stream Overlay</title>
    <link rel="stylesheet" href="overlay.css?v=3.0">
</head>
<body>
    <div id="widgetContainer" class="widget-wrapper">
        <div class="pulse-stream-widget" id="streamWidget">
            <!-- Top Row: Rank Badge / Icon / Level, ELO, KDR, Country & Country Rank -->
            <div class="psw-top-row">
                <div class="psw-left">
                    <!-- Option A: Challenger Pill with #rank + icon (Image 2 & 3) -->
                    <div class="psw-rank-pill" id="pswRankPill">
                        <span class="psw-rank-num" id="pswRankNum">...</span>
                        <div class="psw-rank-icon" id="pswPillIcon" title="Challenger">
                            <!-- Golden Laurel SVG Icon -->
                            <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                                <circle cx="12" cy="12" r="11" fill="#111" stroke="#FFC700" stroke-width="1.2"/>
                                <path d="M12 4.5l1.6 3.2 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#FFC700"/>
                                <path d="M6 16c1-2.5 3-4 6-4s5 1.5 6 4" stroke="#FFC700" stroke-width="1.2" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Option B: Standalone Challenger Laurel Icon (Image 4: showRank=false, showIcon=true) -->
                    <div class="psw-standalone-icon hidden" id="pswStandaloneIcon" title="Challenger">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="#FFC700" stroke-width="1.5" stroke-dasharray="2 1.5"/>
                            <path d="M12 5l1.4 2.8 3.1.4-2.2 2.2.5 3.1-2.8-1.5-2.8 1.5.5-3.1-2.2-2.2 3.1-.4z" fill="#FFC700"/>
                            <path d="M7 16.5c1.2-2.2 3-3.5 5-3.5s3.8 1.3 5 3.5" stroke="#FFC700" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </div>

                    <!-- Option C: Standard Level Badge (Image 5: showRank=false, showIcon=false) -->
                    <div class="psw-level-badge hidden" id="pswLevelBadge">10</div>

                    <span class="psw-elo" id="pswElo">...</span>
                </div>

                <div class="psw-kdr" id="pswKdr">... KDR</div>

                <div class="psw-right">
                    <span class="psw-flag" id="pswFlag"></span>
                    <span class="psw-country-rank" id="pswCountryRank"></span>
                </div>
            </div>

            <!-- Mid Section: Interactive Slides (Last 30 Matches ⇄ Stats Today) -->
            <div class="psw-mid-section" id="pswMidSection">
                <!-- Slide 1: Last N Matches -->
                <div class="psw-slide psw-slide-matches active" id="pswSlideMatches">
                    <div class="psw-mid-row" id="pswMatchesHeader">ЗАВАНТАЖЕННЯ ДАНИХ...</div>
                    <div class="psw-bot-row">
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswWinrate">...</div>
                            <div class="psw-stat-lbl">Win rate</div>
                        </div>
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswKillsAdr">... / ...</div>
                            <div class="psw-stat-lbl">Avg. Kills / ADR</div>
                        </div>
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswKdKr">... / ...</div>
                            <div class="psw-stat-lbl">K/D / K/R</div>
                        </div>
                    </div>
                </div>

                <!-- Slide 2: Stats Today (Image 3) -->
                <div class="psw-slide psw-slide-today" id="pswSlideToday">
                    <div class="psw-mid-row">STATS TODAY</div>
                    <div class="psw-bot-row">
                        <div class="psw-stat-col">
                            <div class="psw-stat-val psw-wl-val">
                                <span class="psw-win-num" id="pswTodayWins">0</span>
                                <span class="psw-loss-num" id="pswTodayLosses">0</span>
                            </div>
                            <div class="psw-stat-lbl psw-wl-lbl">
                                <span class="psw-win-text">Wins</span>
                                <span class="psw-loss-text">Losses</span>
                            </div>
                        </div>
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswTodayKillsAdr">0/0</div>
                            <div class="psw-stat-lbl">Avg. Kills / ADR</div>
                        </div>
                        <div class="psw-stat-col">
                            <div class="psw-stat-val" id="pswTodayKd">0</div>
                            <div class="psw-stat-lbl">K/D</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- v=3.0 breaks OBS & browser cache -->
    <script src="overlay.js?v=3.0"></script>
</body>
</html>
